name: Release 🏗️

on:
  push:
    branches: [master]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    name: Handle release 🦋
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedVersion: ${{ steps.changesets.outputs.publishedVersion }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v1.4.9
        with:
          title: "chore: release"
          commit: "chore: release"
          version: bun changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker 🐳
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Manifold
        uses: docker/login-action@v3
        with:
          registry: manifold.omni.dev
          username: ${{ secrets.MANIFOLD_USERNAME }}
          password: ${{ secrets.MANIFOLD_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            manifold.omni.dev/omni/synapse-api:${{ needs.release.outputs.publishedVersion }}
            manifold.omni.dev/omni/synapse-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  schema:
    name: Publish GraphQL schema 📋
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install oras
        uses: oras-project/setup-oras@v1

      - name: Log in to Manifold
        run: oras login manifold.omni.dev -u ${{ secrets.MANIFOLD_USERNAME }} -p ${{ secrets.MANIFOLD_TOKEN }}

      - name: Push GraphQL schema
        run: |
          oras push manifold.omni.dev/omni/synapse-api-graphql:${{ needs.release.outputs.publishedVersion }} \
            --artifact-type application/vnd.omni.graphql \
            src/generated/graphql/schema.graphql:application/graphql
