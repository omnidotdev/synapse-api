name: Release 🏗️

on:
  push:
    tags: ["v*"]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  packages: write

jobs:
  docker:
    name: Docker 🐳
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Manifold
        uses: docker/login-action@v3
        with:
          registry: manifold.omni.dev
          username: ${{ secrets.MANIFOLD_USERNAME }}
          password: ${{ secrets.MANIFOLD_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            manifold.omni.dev/omni/synapse-api:${{ github.ref_name }}
            manifold.omni.dev/omni/synapse-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  schema:
    name: Publish GraphQL schema 📋
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install oras
        uses: oras-project/setup-oras@v1

      - name: Log in to Manifold
        run: oras login manifold.omni.dev -u ${{ secrets.MANIFOLD_USERNAME }} -p ${{ secrets.MANIFOLD_TOKEN }}

      - name: Push GraphQL schema
        run: |
          oras push manifold.omni.dev/omni/synapse-api-graphql:${{ github.ref_name }} \
            --artifact-type application/vnd.omni.graphql \
            src/generated/graphql/schema.graphql:application/graphql
